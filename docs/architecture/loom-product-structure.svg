  <title id="title">Loom 产品结构图</title>
  <desc id="summary">命令行与会话共用项目库。上方显式建索引，中间按快照交付 context 四区；下方的虚线是可选的导入和模型调用。</desc>
  <style>text { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; fill: #183931; }
.heading { font-size: 32px; font-weight: 700; } .label, .section { font-size: 17px; font-weight: 700; }
.intro { font-size: 15px; } .sub { font-size: 12px; } .body { font-size: 14px; } .tag, .caption { font-size: 12px; fill: #405a50; }
.node rect { rx: 8px; stroke-width: 1.5px; } .read rect { fill: #e7f3ec; stroke: #8bb4a3; } .write rect { fill: #f8f3e8; stroke: #bfac86; }
.output rect { fill: #e9f1f7; stroke: #99b4c5; } .entry rect { fill: #184f43; stroke: #133f36; } .entry text { fill: #fff; }
.optional rect { fill: #f1eef5; stroke: #a697b2; stroke-dasharray: 6 4; } .edge { stroke: #648479; stroke-width: 1.8px; fill: none; }
 .model rect { fill: #fcf4e4; stroke: #bd8d40; stroke-dasharray: 6 4; }
</style>
