[workspace]
resolver = "3"
members = ["crates/loom-core", "crates/loom-mcp", "crates/loom-cli", "crates/loom-parse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }
loom-mcp = { path = "crates/loom-mcp" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
walkdir = "2"
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
