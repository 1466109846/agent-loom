  <text x="88" y="53" class="heading">Loom 产品结构图</text>
  <text x="88" y="80" class="intro">命令行与会话共用项目库。上方显式建索引，中间按快照交付 context 四区；下方的虚线是可选的导入和模型调用。</text>
  <path d="M24 99H1600" stroke="#c8d6cd"/>
  <g id="map" transform="translate(0 99)">
    <path id="session-to-guide" d="M 154 208 L 154 110" class="edge" marker-end="url(#arrow)"/>
