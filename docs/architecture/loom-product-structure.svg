    <text x="314" y="419" class="caption" text-anchor="middle">经验</text>
    <path id="knowledge-to-project" d="M 474 388 L 474 347 Q 474 339 482 339 L 786 339 Q 794 339 794 331 L 794 290" class="edge" marker-end="url(#arrow)"/>
    <path id="knowledge-to-recall" d="M 604 429 L 664 429" class="edge" marker-end="url(#arrow)"/>
    <text x="634" y="419" class="caption" text-anchor="middle">经验</text>
